name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  windows:
    name: Créer l'installateur
    runs-on: windows-2022
    env:
      QT_DIR: C:/Qt/6.7.3/msvc2019_64
    steps:
      - uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Installer Qt 6.7.3
        run: |
          python -m pip install --upgrade pip aqtinstall
          python -m aqt install-qt windows desktop 6.7.3 win64_msvc2019_64 -m qtcharts -O C:/Qt

      - name: Compiler
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="$env:QT_DIR"
          cmake --build build --config Release

      - name: Préparer les fichiers
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist/Pointage | Out-Null
          Copy-Item build/Release/pointage.exe dist/Pointage/
          & "$env:QT_DIR/bin/windeployqt.exe" --release --no-translations dist/Pointage/pointage.exe

      - name: Installer Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Créer l'installateur
        shell: pwsh
        run: '& "C:/Program Files (x86)/Inno Setup 6/ISCC.exe" installer/pointage.iss'

      - name: Publier la Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/Pointage-Setup-*.exe
          generate_release_notes: true
