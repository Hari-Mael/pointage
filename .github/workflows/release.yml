name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    name: Créer l'installation Windows
    runs-on: windows-2022
    env:
      QT_DIR: C:/Qt/6.7.3/msvc2019_64
    steps:
      - uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Installer Qt
        run: |
          python -m pip install --upgrade pip aqtinstall
          python -m aqt install-qt windows desktop 6.7.3 win64_msvc2019_64 -m qtsql -O C:/Qt

      - name: Compiler
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="$env:QT_DIR"
          cmake --build build --config Release

      - name: Préparer le dossier d'installation
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist/Pointage | Out-Null
          Copy-Item build/Release/pointage.exe dist/Pointage/
          & "$env:QT_DIR/bin/windeployqt.exe" --release --no-translations dist/Pointage/pointage.exe

      - name: Archiver
        shell: pwsh
        run: Compress-Archive -Path dist/Pointage/* -DestinationPath "Pointage-${{ github.ref_name }}-windows.zip"

      - name: Publier la Release
        uses: softprops/action-gh-release@v2
        with:
          files: Pointage-${{ github.ref_name }}-windows.zip
          generate_release_notes: true
